openapi: 3.1.0
info:
  title: Historical Crop Evidence API
  version: 1.0.0
  summary: Historical crop evidence for the PWA.
  description: |
    Versioned contract for a historical-evidence MVP. Results summarize local
    records; they do not assess live weather, predict phenology, or establish
    which crop is best. See docs/api-contract.md for evidence and coverage
    assumptions.
  contact:
    name: API maintainers
security: []
servers:
  - url: /
    description: Configure the deployment's HTTPS API origin.
tags:
  - name: Historical evidence
    description: Local historical planting-calendar and crop-area summaries.
paths:
  /v1/recommendations:
    post:
      tags: [Historical evidence]
      operationId: getHistoricalCropAssessment
      summary: Summarize historical planting evidence for one crop and location.
      description: |
        Accepts either an address or coordinates and one crop catalog ID.
        Planting months are reported only when supported by a local historical
        planting-calendar source. Historical prevalence is a share of reported
        cropped area only when comparable area records exist. Neither metric
        measures live weather suitability, predicts crop phenology, or proves
        the crop is best. Address geocoding and provider access happen
        server-side; provider credentials must never be sent by the PWA.
        Location requests are sensitive and are not cacheable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
            examples:
              coordinates:
                summary: Coordinates and crop catalog ID
                value:
                  location:
                    latitude: -1.2864
                    longitude: 36.8172
                  crop:
                    id: crop-example-a
              address:
                summary: Address and crop catalog ID
                value:
                  location:
                    address: 'Example district, Example country'
                  crop:
                    id: crop-example-a
      responses:
        '200':
          description: At least one requested-crop historical indicator is available.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalAssessmentResponse'
              examples:
                completeEvidence:
                  summary: Illustrative schema example only; not a HarvestStat lookup
                  value:
                    request_id: req_01JEXAMPLE8Z5Q
                    location:
                      matched_area:
                        spatial_unit: administrative_area
                        label: Example district, Example country
                    crop:
                      id: crop-example-a
                      name: Example crop A
                    likely_planting_window:
                      status: available
                      start_month: 3
                      end_month: 5
                      crosses_year_boundary: false
                      evidence_basis: historical_planting_calendar
                    local_historical_prevalence:
                      status: available
                      share: 0.32
                      numerator:
                        value: 320
                        unit: hectare
                      denominator:
                        value: 1000
                        unit: hectare
                      observation_period:
                        start_year: 2018
                        end_year: 2023
                      evidence_basis: reported_cropped_area
                    confidence_band:
                      level: low
                      rationale: The planting window comes from a historical calendar; the area records are limited and do not describe farm-level conditions.
                    caveats:
                      - All values in this example are illustrative schema values, not source data.
                      - Historical area share describes reported cultivation, not agronomic suitability or future demand.
                      - No live weather or farm-level soil data is assessed.
                    data:
                      sources:
                        - name: Example local planting calendar
                          type: planting_calendar
                          observation_period:
                            start_year: 2018
                            end_year: 2023
                          retrieved_at: '2026-11-01T00:00:00Z'
                        - name: Example agricultural statistics dataset
                          type: agricultural_statistics
                          observation_period:
                            start_year: 2018
                            end_year: 2023
                          retrieved_at: '2026-11-01T00:00:00Z'
                partialEvidence:
                  summary: Illustrative schema example only; not a HarvestStat lookup
                  value:
                    request_id: req_01JEXAMPLEPARTIAL
                    location:
                      matched_area:
                        spatial_unit: administrative_area
                        label: Example district, Example country
                    crop:
                      id: crop-example-a
                      name: Example crop A
                    likely_planting_window:
                      status: unavailable
                      reason: no_local_planting_calendar
                    local_historical_prevalence:
                      status: available
                      share: 0.32
                      numerator:
                        value: 320
                        unit: hectare
                      denominator:
                        value: 1000
                        unit: hectare
                      observation_period:
                        start_year: 2018
                        end_year: 2023
                      evidence_basis: reported_cropped_area
                    confidence_band:
                      level: low
                      rationale: Only historical area records are available; no local planting calendar supports a planting window.
                    caveats:
                      - All values in this example are illustrative schema values, not source data.
                      - The planting window is unavailable; annual area records do not reveal planting dates.
                      - Historical area share is not proof of suitability or a live recommendation.
                    data:
                      sources:
                        - name: Example agricultural statistics dataset
                          type: agricultural_statistics
                          observation_period:
                            start_year: 2018
                            end_year: 2023
                          retrieved_at: '2026-11-01T00:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: The request is valid JSON but cannot produce a historical assessment.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Request field validation failed
                  value:
                    error:
                      code: validation_error
                      message: The request contains invalid or conflicting fields.
                      details:
                        - field: crop.id
                          issue: Must identify a crop in the configured catalog.
                      request_id: req_01JEXAMPLEVALIDATION
                      retryable: false
                unsupportedLocation:
                  summary: Location is outside configured evidence coverage
                  value:
                    error:
                      code: unsupported_location
                      message: This location is outside the currently supported historical evidence areas.
                      details: []
                      request_id: req_01JEXAMPLEUNSUPPORTED
                      retryable: false
                unsupportedCrop:
                  summary: Crop ID is not in the configured catalog
                  value:
                    error:
                      code: unsupported_crop
                      message: The requested crop is not in the configured catalog.
                      details:
                        - field: crop.id
                          issue: No matching crop ID is available.
                      request_id: req_01JEXAMPLECROP
                      retryable: false
                insufficientEvidence:
                  summary: Neither historical indicator has usable local evidence
                  value:
                    error:
                      code: insufficient_evidence
                      message: Available local historical data is not sufficient to report a planting window or prevalence.
                      details:
                        - field: data
                          issue: No qualifying local planting-calendar or comparable crop-area records are available.
                      request_id: req_01JEXAMPLEEVIDENCE
                      retryable: false
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-codeSamples:
        - lang: JavaScript
          label: Browser fetch
          source: |
            const response = await fetch(`${API_BASE_URL}/v1/recommendations`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                location: { latitude: -1.2864, longitude: 36.8172 },
                crop: { id: "crop-example-a" }
              })
            });
            const result = await response.json();
components:
  headers:
    NoStore:
      description: Responses containing a location are never stored by HTTP caches.
      schema:
        type: string
        const: no-store
    RequestId:
      description: Opaque identifier for support and server-side diagnostics.
      schema:
        type: string
  responses:
    BadRequest:
      description: The request body is malformed JSON.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            malformedJson:
              value:
                error:
                  code: bad_request
                  message: The body must be valid JSON.
                  details: []
                  request_id: req_01JEXAMPLEBAD
                  retryable: false
    UnsupportedMediaType:
      description: The request Content-Type is not application/json.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unsupportedMediaType:
              value:
                error:
                  code: unsupported_media_type
                  message: Content-Type must be application/json.
                  details: []
                  request_id: req_01JEXAMPLEMEDIA
                  retryable: false
    RateLimited:
      description: The request rate limit was exceeded.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Seconds before another request may be attempted.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rateLimited:
              value:
                error:
                  code: rate_limited
                  message: Too many requests. Try again later.
                  details: []
                  request_id: req_01JEXAMPLERATE
                  retryable: true
    ServerError:
      description: An unexpected server error occurred.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: A required historical data source or service is temporarily unavailable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Optional seconds before a retry is appropriate.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            upstreamUnavailable:
              value:
                error:
                  code: service_unavailable
                  message: Historical evidence is temporarily unavailable.
                  details: []
                  request_id: req_01JEXAMPLEUNAVAILABLE
                  retryable: true
  schemas:
    RecommendationRequest:
      type: object
      additionalProperties: false
      required: [location, crop]
      properties:
        location:
          oneOf:
            - $ref: '#/components/schemas/AddressLocation'
            - $ref: '#/components/schemas/CoordinateLocation'
          description: Provide exactly one address or coordinate pair.
        crop:
          $ref: '#/components/schemas/CropReference'
    AddressLocation:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        address:
          type: string
          minLength: 3
          maxLength: 300
          description: A place or address to geocode server-side. Do not include personal names.
    CoordinateLocation:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Decimal degrees, WGS 84.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Decimal degrees, WGS 84.
    CropReference:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
          description: Stable ID of a crop in the configured crop catalog; display names are resolved by the service.
    HistoricalAssessmentResponse:
      type: object
      additionalProperties: false
      required:
        - request_id
        - location
        - crop
        - likely_planting_window
        - local_historical_prevalence
        - confidence_band
        - caveats
        - data
      properties:
        request_id:
          type: string
          description: Opaque identifier matching X-Request-Id.
        location:
          type: object
          additionalProperties: false
          required: [matched_area]
          properties:
            matched_area:
              type: object
              additionalProperties: false
              required: [spatial_unit, label]
              properties:
                spatial_unit:
                  type: string
                  enum: [administrative_area, grid_cell, other]
                label:
                  type: string
                  description: Human-readable matched evidence area; do not imply finer precision than the source.
                id:
                  type: string
                  description: Optional public area identifier, when available.
        crop:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        likely_planting_window:
          $ref: '#/components/schemas/PlantingWindow'
        local_historical_prevalence:
          $ref: '#/components/schemas/HistoricalPrevalence'
        confidence_band:
          $ref: '#/components/schemas/ConfidenceBand'
        caveats:
          type: array
          minItems: 1
          items:
            type: string
          description: Must state material evidence limitations; empty caveats are not permitted.
        data:
          $ref: '#/components/schemas/HistoricalData'
    PlantingWindow:
      oneOf:
        - $ref: '#/components/schemas/AvailablePlantingWindow'
        - $ref: '#/components/schemas/UnavailablePlantingWindow'
      description: |
        Recurring local calendar months reported in historical planting-calendar
        evidence, not a forecast or a future date. HarvestStat-Africa calendar
        fields distinguish seasons, including those spanning calendar years;
        they do not represent actual phenological timing. Present them only as
        recorded historical calendar metadata, with a caveat. Never derive
        this window from annual production or area totals alone.
    AvailablePlantingWindow:
      type: object
      additionalProperties: false
      required: [status, start_month, end_month, crosses_year_boundary, evidence_basis]
      properties:
        status:
          type: string
          const: available
        start_month:
          type: integer
          minimum: 1
          maximum: 12
          description: First local calendar month recorded by the historical source.
        end_month:
          type: integer
          minimum: 1
          maximum: 12
          description: Last local calendar month recorded by the historical source, inclusive.
        crosses_year_boundary:
          type: boolean
          description: True when the recurring window continues from one calendar year into the next.
        evidence_basis:
          type: string
          const: historical_planting_calendar
    UnavailablePlantingWindow:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          type: string
          const: unavailable
        reason:
          type: string
          enum: [no_local_planting_calendar, insufficient_calendar_evidence]
    HistoricalPrevalence:
      oneOf:
        - $ref: '#/components/schemas/AvailableHistoricalPrevalence'
        - $ref: '#/components/schemas/UnavailableHistoricalPrevalence'
      description: |
        Share of comparable reported cropped area in the matched location and
        stated observation period attributed to the requested crop, divided by
        the total comparable reported cropped area in that same location and
        period. HarvestStat-Africa can support this only where comparable area
        records exist. This describes historical reporting, not suitability.
    AvailableHistoricalPrevalence:
      type: object
      additionalProperties: false
      required: [status, share, numerator, denominator, observation_period, evidence_basis]
      properties:
        status:
          type: string
          const: available
        share:
          type: number
          minimum: 0
          maximum: 1
          description: numerator.value divided by denominator.value, using the same area unit and reporting scope.
        numerator:
          $ref: '#/components/schemas/AreaTotal'
        denominator:
          $ref: '#/components/schemas/AreaTotal'
        observation_period:
          $ref: '#/components/schemas/YearRange'
        evidence_basis:
          type: string
          const: reported_cropped_area
    AreaTotal:
      type: object
      additionalProperties: false
      required: [value, unit]
      properties:
        value:
          type: number
          minimum: 0
          description: Aggregated area total over the stated, consistently defined reporting period.
        unit:
          type: string
          const: hectare
    UnavailableHistoricalPrevalence:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          type: string
          const: unavailable
        reason:
          type: string
          enum: [no_comparable_area_records, insufficient_area_evidence]
    ConfidenceBand:
      type: object
      additionalProperties: false
      required: [level, rationale]
      properties:
        level:
          type: string
          enum: [low, moderate, high]
          description: Qualitative evidence-strength band, not a probability or statistical confidence interval.
        rationale:
          type: string
          description: Explains the influence of evidence amount, age, geographic match, and source comparability.
    HistoricalData:
      type: object
      additionalProperties: false
      required: [sources]
      properties:
        sources:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [name, type, retrieved_at]
            properties:
              name:
                type: string
                description: Public source or dataset name; never a credential or secret.
              type:
                type: string
                enum: [planting_calendar, agricultural_statistics, other]
              observation_period:
                $ref: '#/components/schemas/YearRange'
              retrieved_at:
                type: string
                format: date-time
                description: Time the API retrieved this historical source, in UTC.
    YearRange:
      type: object
      additionalProperties: false
      required: [start_year, end_year]
      properties:
        start_year:
          type: integer
          minimum: 1900
          maximum: 2100
        end_year:
          type: integer
          minimum: 1900
          maximum: 2100
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details, request_id, retryable]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - unsupported_media_type
                - validation_error
                - unsupported_location
                - unsupported_crop
                - insufficient_evidence
                - rate_limited
                - internal_error
                - service_unavailable
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, issue]
                properties:
                  field:
                    type: string
                  issue:
                    type: string
            request_id:
              type: string
            retryable:
              type: boolean
