openapi: 3.1.0
info:
  title: Crop Recommendation API
  version: 1.0.0
  summary: Historical crop evidence for the PWA; no suitability claims.
  description: |
    Versioned JSON contract for the MVP. Recommendations are decision support,
    not agronomic guarantees. A response must distinguish source-backed
    evidence from uncertainty and must not recommend crops where evidence is
    insufficient. See docs/api-contract.md for MVP coverage and operational
    assumptions.
  contact:
    name: API maintainers
security: []
servers:
  - url: /
    description: Configure the deployment's HTTPS API origin.
tags:
  - name: Recommendations
    description: Historical crop evidence; current data is insufficient for recommendations.
  - name: Locations
    description: Exact coordinate-to-administrative-area resolution.
paths:
  /v1/locations/resolve:
    post:
      tags: [Locations]
      operationId: resolveLocation
      summary: Resolve coordinates to one exact HarvestStat area.
      description: |
        Resolves a WGS 84 point against the pinned HarvestStat Africa v1.2
        administrative polygons and returns an FNID only when that exact
        feature has historical crop records in the v1.2 coverage index.
        No address geocoding, nearest-area, parent-area fallback, or agronomic
        suitability inference is performed. Points on boundaries and overlaps
        are ambiguous. Coordinates must not be logged or persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationResolutionRequest'
            example:
              location:
                latitude: -1.2864
                longitude: 36.8172
      responses:
        '200':
          description: The coordinate falls in one exact supported administrative area.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResolutionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Coordinates are invalid, unsupported, or spatially ambiguous.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Coordinate range validation failed
                  value:
                    error:
                      code: validation_error
                      message: The request contains invalid or conflicting fields.
                      details:
                        - field: location.latitude
                          issue: Must be between -90 and 90 degrees.
                      request_id: req_01JEXAMPLECOORDVALID
                      retryable: false
                unsupportedLocation:
                  summary: No exact historically indexed area contains this point
                  value:
                    error:
                      code: unsupported_location
                      message: No exact supported administrative area contains this location.
                      details: []
                      request_id: req_01JEXAMPLECOORDUNSUPPORTED
                      retryable: false
                ambiguousLocation:
                  summary: Point lies on or overlaps administrative boundaries
                  value:
                    error:
                      code: ambiguous_location
                      message: This location falls on an ambiguous administrative boundary.
                      details: []
                      request_id: req_01JEXAMPLECOORDAMBIGUOUS
                      retryable: false
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /healthz:
    get:
      operationId: healthCheck
      summary: Check service health.
      responses:
        '200':
          description: The API is ready to receive requests.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, request_id]
                properties:
                  status:
                    type: string
                    const: ok
                  request_id:
                    type: string
  /v1/recommendations:
    post:
      tags: [Recommendations]
      operationId: createRecommendation
      summary: Check historical crop evidence for a location.
      description: |
        Accepts WGS 84 coordinates and, optionally, one exact catalog crop ID.
        This is a historical-evidence-only MVP; it does not assess agronomic
        suitability. When `crop_id` is omitted, the response lists the crops
        with historical records in the pinned HarvestStat Africa v1.2 coverage
        index for the exact resolved administrative area; it is not a
        suitability ranking and no prevalence or share is computed. When
        `crop_id` is provided, the single-crop path is unchanged: the current
        service returns insufficient_evidence rather than a recommendation
        because the catalog has no validated comparable-area denominator or
        evidence thresholds. HarvestStat calendar fields distinguish reported
        seasons; they are not phenological timing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
            examples:
              cropAtLocation:
                summary: A catalog crop and coordinates
                value:
                  location:
                    latitude: -1.2864
                    longitude: 36.8172
                  crop_id: hsa-v1-2-maize-637a42a5
              cropOptionsAtLocation:
                summary: Coordinates only; lists historically reported crops
                value:
                  location:
                    latitude: -1.2864
                    longitude: 36.8172
      responses:
        '200':
          description: |
            Location-only request resolved to one exact indexed area and
            listed the crops with historical records there. Emitted only when
            `crop_id` is omitted.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropOptionsResponse'
              example:
                request_id: req_01JEXAMPLECROPOPTIONS
                resolved_location:
                  fnid: KE2013A147
                  country_code: KE
                  country: Kenya
                  admin_level: 1
                  admin_1: Nairobi
                  admin_2: null
                  boundary_source:
                    id: harveststat-boundaries-v1-2
                    version: v1.2
                options:
                  - crop_id: hsa-v1-2-maize-637a42a5
                    crop_label: Maize
                    summary:
                      record_count: 34
                      seasons_observed:
                        - season_name: Annual
                          planting_months: [1]
                          harvest_months: [12]
                        - season_name: Long
                          planting_months: [3]
                          harvest_months: [8]
                        - season_name: Short
                          planting_months: [10]
                          harvest_months: [3]
                    evidence_hint: 34 source records across 3 reported seasons.
                notes:
                  - Options are crops with historical records in the pinned HarvestStat Africa v1.2 coverage index for this exact administrative area; this is not a suitability ranking or recommendation.
                  - Record counts are raw source record counts; no prevalence, share, or ranking is computed.
                  - HarvestStat season and month fields describe reported seasons; they are not phenological timing.
                  - Absence from this list means no indexed historical record in the pinned release; it does not mean the crop is absent or unsuitable.
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: |
            The request is valid JSON but cannot produce a recommendation or
            crop options. Applies to invalid fields, unsupported geography,
            and locations or crops without indexed historical records.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Request field validation failed
                  value:
                    error:
                      code: validation_error
                      message: The request contains invalid or conflicting fields.
                      details:
                        - field: crop_id
                          issue: Provide a catalog crop ID.
                      request_id: req_01JEXAMPLEVALIDATION
                      retryable: false
                unsupportedLocation:
                  summary: Location is outside configured evidence coverage
                  value:
                    error:
                      code: unsupported_location
                      message: This location is outside the currently supported recommendation area.
                      details: []
                      request_id: req_01JEXAMPLEUNSUPPORTED
                      retryable: false
                insufficientEvidence:
                  summary: Location is covered but evidence is not sufficient
                  value:
                    error:
                      code: insufficient_evidence
                      message: Historical records do not support a defensible prevalence estimate or planting recommendation.
                      details:
                        - field: data.prevalence
                          issue: The catalog has no validated comparable-area denominator.
                        - field: data.evidence_band
                          issue: Evidence thresholds have not been validated.
                        - field: data.planting_window
                          issue: HarvestStat calendar fields distinguish reported seasons; they are not phenological timing.
                      request_id: req_01JEXAMPLEEVIDENCE
                      retryable: false
                insufficientEvidenceNoOptions:
                  summary: Covered location has no indexed crop records
                  value:
                    error:
                      code: insufficient_evidence
                      message: No historical crop records are indexed for this administrative area.
                      details:
                        - field: data.crop_options
                          issue: The exact administrative area has no indexed crop records.
                      request_id: req_01JEXAMPLENOOPTIONS
                      retryable: false
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-codeSamples:
        - lang: JavaScript
          label: Browser fetch
          source: |
            const response = await fetch(`${API_BASE_URL}/v1/recommendations`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                location: { latitude: -1.2864, longitude: 36.8172 },
                crop_id: "hsa-v1-2-maize-637a42a5"
              })
            });
            const result = await response.json();
        - lang: JavaScript
          label: Browser fetch (crop options)
          source: |
            const response = await fetch(`${API_BASE_URL}/v1/recommendations`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                location: { latitude: -1.2864, longitude: 36.8172 }
              })
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error.message);
            // result.options: historically reported crops; pass a crop_id back
            // for the single-crop historical-evidence check.
components:
  headers:
    NoStore:
      description: Responses containing a location are never stored by HTTP caches.
      schema:
        type: string
        const: no-store
    RequestId:
      description: Opaque identifier for support and server-side diagnostics.
      schema:
        type: string
  responses:
    BadRequest:
      description: The request body is malformed JSON.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            malformedJson:
              value:
                error:
                  code: bad_request
                  message: The body must be valid JSON.
                  details: []
                  request_id: req_01JEXAMPLEBAD
                  retryable: false
    UnsupportedMediaType:
      description: The request Content-Type is not application/json.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unsupportedMediaType:
              value:
                error:
                  code: unsupported_media_type
                  message: Content-Type must be application/json.
                  details: []
                  request_id: req_01JEXAMPLEMEDIA
                  retryable: false
    RateLimited:
      description: The request rate limit was exceeded.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Seconds before another request may be attempted.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rateLimited:
              value:
                error:
                  code: rate_limited
                  message: Too many requests. Try again later.
                  details: []
                  request_id: req_01JEXAMPLERATE
                  retryable: true
    ServerError:
      description: An unexpected server error occurred.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: A required upstream source or service is temporarily unavailable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Optional seconds before a retry is appropriate.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            upstreamUnavailable:
              value:
                error:
                  code: service_unavailable
                  message: Recommendation data is temporarily unavailable.
                  details: []
                  request_id: req_01JEXAMPLEUNAVAILABLE
                  retryable: true
  schemas:
    RecommendationRequest:
      type: object
      additionalProperties: false
      required: [location]
      description: |
        Coordinates with an optional catalog crop ID. Omitting `crop_id`
        requests the crop options list for the exact resolved administrative
        area; providing `crop_id` requests the single-crop historical-evidence
        check, whose behavior is unchanged.
      properties:
        location:
          $ref: '#/components/schemas/CoordinateLocation'
        crop_id:
          type: string
          minLength: 1
          description: |
            Exact crop ID from the versioned data catalog. Optional: when
            omitted, the endpoint returns the crops with indexed historical
            records at this location instead of the single-crop check.
    LocationResolutionRequest:
      type: object
      additionalProperties: false
      required: [location]
      properties:
        location:
          $ref: '#/components/schemas/CoordinateLocation'
    CoordinateLocation:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Decimal degrees, WGS 84.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Decimal degrees, WGS 84.
    LocationResolutionResponse:
      type: object
      additionalProperties: false
      required: [request_id, resolved_location]
      properties:
        request_id:
          type: string
          description: Opaque identifier matching X-Request-Id; it does not encode coordinates.
        resolved_location:
          $ref: '#/components/schemas/ResolvedLocation'
    ResolvedLocation:
      type: object
      additionalProperties: false
      required: [fnid, country_code, country, admin_level, admin_1, admin_2, boundary_source]
      properties:
        fnid:
          type: string
          description: HarvestStat administrative feature identifier.
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2 code.
        country:
          type: string
        admin_level:
          type: integer
          enum: [1, 2]
        admin_1:
          type: string
        admin_2:
          type: [string, 'null']
        boundary_source:
          type: object
          additionalProperties: false
          required: [id, version]
          properties:
            id:
              type: string
              const: harveststat-boundaries-v1-2
            version:
              type: string
              const: v1.2
    CropOptionsResponse:
      type: object
      additionalProperties: false
      required: [request_id, resolved_location, options, notes]
      description: |
        Crops with historical records in the pinned HarvestStat Africa v1.2
        coverage index for the exact resolved administrative area. This is a
        historical-occurrence inventory, not a suitability ranking; no
        prevalence, share, or ranking is computed. Emitted only when the
        request omits `crop_id`.
      properties:
        request_id:
          type: string
          description: Opaque identifier matching X-Request-Id; it does not encode coordinates.
        resolved_location:
          $ref: '#/components/schemas/ResolvedLocation'
        options:
          type: array
          minItems: 1
          description: |
            Deterministically ordered by crop label; order carries no
            suitability ranking.
          items:
            $ref: '#/components/schemas/CropOption'
        notes:
          type: array
          description: Explicit caveats about the options semantics.
          items:
            type: string
    CropOption:
      type: object
      additionalProperties: false
      required: [crop_id, crop_label, summary, evidence_hint]
      properties:
        crop_id:
          type: string
          minLength: 1
          description: Stable catalog crop ID usable in follow-up requests.
        crop_label:
          type: string
          minLength: 1
        summary:
          $ref: '#/components/schemas/CropOptionsSummary'
        evidence_hint:
          type: string
          minLength: 1
          description: |
            Qualitative description of the indexed historical occurrences; it
            is not a prevalence estimate or quality assessment.
    CropOptionsSummary:
      type: object
      additionalProperties: false
      required: [record_count, seasons_observed]
      properties:
        record_count:
          type: integer
          minimum: 1
          description: Raw count of source records for this crop and area in the pinned release.
        seasons_observed:
          type: array
          minItems: 1
          description: Reported seasons observed; these are reporting seasons, not phenological timing.
          items:
            $ref: '#/components/schemas/CropSeasonObservation'
    CropSeasonObservation:
      type: object
      additionalProperties: false
      required: [season_name, planting_months, harvest_months]
      properties:
        season_name:
          type: string
          minLength: 1
        planting_months:
          type: array
          minItems: 1
          description: Months in which records were reported for planting.
          items:
            type: integer
            minimum: 1
            maximum: 12
        harvest_months:
          type: array
          minItems: 1
          description: Months in which records were reported for harvest.
          items:
            type: integer
            minimum: 1
            maximum: 12
    RecommendationResponse:
      type: object
      additionalProperties: false
      required: [request_id, recommendations, data, uncertainty]
      properties:
        request_id:
          type: string
          description: Opaque identifier matching X-Request-Id.
        recommendations:
          type: array
          minItems: 1
          description: Candidates ordered by relative suitability; rank is not a probability.
          items:
            $ref: '#/components/schemas/Recommendation'
        data:
          $ref: '#/components/schemas/DataFreshness'
        uncertainty:
          $ref: '#/components/schemas/Uncertainty'
    Recommendation:
      type: object
      additionalProperties: false
      required: [rank, crop, planting_window, explanations, risks, confidence]
      properties:
        rank:
          type: integer
          minimum: 1
        crop:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        planting_window:
          type: object
          additionalProperties: false
          required: [start_date, end_date, basis]
          properties:
            start_date:
              type: string
              format: date
              description: Suggested local calendar date.
            end_date:
              type: string
              format: date
              description: Suggested local calendar date, on or after start_date.
            basis:
              type: string
              enum: [data_supported, provisional]
              description: Whether local evidence supports the window or it remains provisional.
        explanations:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [kind, text]
            properties:
              kind:
                type: string
                enum: [evidence, user_input, limitation]
              text:
                type: string
        risks:
          type: array
          items:
            type: string
          description: Known material caveats; an empty list does not imply no risk.
        confidence:
          type: object
          additionalProperties: false
          required: [level, rationale]
          properties:
            level:
              type: string
              enum: [low, moderate, high]
              description: Qualitative evidence strength, not a probability or calibrated score.
            rationale:
              type: string
    DataFreshness:
      type: object
      additionalProperties: false
      required: [as_of, sources]
      properties:
        as_of:
          type: string
          format: date-time
          description: Latest time at which source data used in this response was current, in UTC.
        sources:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [name, type, retrieved_at]
            properties:
              name:
                type: string
                description: Public source or dataset name; never a credential or secret.
              type:
                type: string
                enum: [climate, soil, agronomy, other]
              observed_at:
                type: string
                format: date-time
                description: Optional observation or source publication time, in UTC.
              retrieved_at:
                type: string
                format: date-time
                description: Time the API retrieved this source, in UTC.
    Uncertainty:
      type: object
      additionalProperties: false
      required: [summary, not_a_guarantee]
      properties:
        summary:
          type: string
        not_a_guarantee:
          type: boolean
          const: true
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details, request_id, retryable]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - unsupported_media_type
                - validation_error
                - unsupported_location
                - ambiguous_location
                - insufficient_evidence
                - rate_limited
                - internal_error
                - service_unavailable
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, issue]
                properties:
                  field:
                    type: string
                  issue:
                    type: string
            request_id:
              type: string
            retryable:
              type: boolean
